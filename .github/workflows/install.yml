name: install

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catches pinned upstream commits disappearing

jobs:
  bash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install from checkout
        run: CLAUDE_SKILLS_DIR="$RUNNER_TEMP/local" ./install.sh
      - name: Install from GitHub (curl path)
        if: github.event_name != 'pull_request'
        run: curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh" | CLAUDE_SKILLS_DIR="$RUNNER_TEMP/remote" SHIP_TASK_REF="$GITHUB_SHA" bash
      - name: Verify checkout install
        run: ./tests/verify.sh "$RUNNER_TEMP/local"
      - name: Verify curl install
        if: github.event_name != 'pull_request'
        run: ./tests/verify.sh "$RUNNER_TEMP/remote"

  powershell:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install from checkout (${{ matrix.shell }})
        shell: ${{ matrix.shell }}
        run: |
          $env:CLAUDE_SKILLS_DIR = "$env:RUNNER_TEMP\ps"
          ./install.ps1
      - name: Verify
        shell: bash
        run: ./tests/verify.sh "$RUNNER_TEMP/ps"
