name: install

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catches pinned upstream commits disappearing

jobs:
  bash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install from checkout
        run: CLAUDE_SKILLS_DIR="$RUNNER_TEMP/local" ./install.sh
      - name: Install from GitHub (curl path)
        if: github.event_name != 'pull_request'
        run: curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh" | CLAUDE_SKILLS_DIR="$RUNNER_TEMP/remote" SHIP_TASK_REF="$GITHUB_SHA" bash
      - name: Verify checkout install
        run: ./tests/verify.sh "$RUNNER_TEMP/local"
      - name: Verify curl install
        if: github.event_name != 'pull_request'
        run: ./tests/verify.sh "$RUNNER_TEMP/remote"

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install with Windows PowerShell 5.1
        shell: powershell
        run: |
          $env:CLAUDE_SKILLS_DIR = "$env:RUNNER_TEMP\ps5"
          ./install.ps1
      - name: Install with PowerShell 7
        shell: pwsh
        run: |
          $env:CLAUDE_SKILLS_DIR = "$env:RUNNER_TEMP\ps7"
          ./install.ps1
      - name: Install via irm | iex
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          $env:CLAUDE_SKILLS_DIR = "$env:RUNNER_TEMP\psremote"
          $env:SHIP_TASK_REF = "$env:GITHUB_SHA"
          irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install.ps1" | iex
      - name: Verify
        shell: bash
        run: |
          ./tests/verify.sh "$RUNNER_TEMP/ps5" "$RUNNER_TEMP/ps7"
          if [ "${{ github.event_name }}" != pull_request ]; then ./tests/verify.sh "$RUNNER_TEMP/psremote"; fi
